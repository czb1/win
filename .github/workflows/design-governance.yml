name: design-governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check four-module design documentation
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          python3 tools/check_design_governance.py --base "$base" --head "${{ github.sha }}"
