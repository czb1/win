name: Python strategy checks

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.10'
      - name: Unit, protocol and HTTP regressions
        run: python -m unittest discover -s tests -v
      - name: First-day construction replay
        run: python tools/fortification_benchmark.py
      - name: Economy progression and static combat replay
        run: |
          python tools/progression_benchmark.py
          python tools/strategy_benchmark.py
      - name: Compare pre-fix construction baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/win-baseline" 767b72d494fd5772eccd61d4df27bb4f17de1909
          python tools/fortification_benchmark.py --agent-root "$RUNNER_TEMP/win-baseline"
