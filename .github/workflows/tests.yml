name: Python strategy checks

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      full:
        description: Run simulations and the strategy benchmark
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.10'
      - name: Fast offline validation
        if: ${{ !inputs.full }}
        run: python tools/run_checks.py
      - name: Full offline validation (manual opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: python tools/run_checks.py --full
      - name: Preserve validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-log
          path: artifacts/validation/
          retention-days: 7

