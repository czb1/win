name: Publish CoreGeek archive

on:
  push:
    branches:
      - main
      - develop
      - personal/cyf-develop

permissions:
  contents: write

concurrency:
  group: coregeek-release-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  package-and-release:
    name: Package and publish CoreGeek
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine v2 release version
        id: version
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          latest_patch=-1
          release_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v2[.]0[.](0|[1-9][0-9]*)$ ]]; then
              patch="${BASH_REMATCH[1]}"
              if (( patch > latest_patch )); then
                latest_patch="$patch"
              fi
              if [[ "$SOURCE_BRANCH" == "main" && "$(git rev-list -n 1 "$tag")" == "$SOURCE_SHA" ]]; then
                release_tag="$tag"
              fi
            elif [[ "$SOURCE_BRANCH" != "main" && "$tag" =~ ^v2[.]0[.](0|[1-9][0-9]*)-dev[.]([0-9]+)$ ]]; then
              tag_run="${BASH_REMATCH[2]}"
              if [[ "$tag_run" == "$RUN_NUMBER" && "$(git rev-list -n 1 "$tag")" == "$SOURCE_SHA" ]]; then
                release_tag="$tag"
              fi
            fi
          done < <(git tag --list 'v2.0.*' --sort=version:refname)

          if [[ -z "$release_tag" ]]; then
            release_tag="v2.0.$((latest_patch + 1))"
            if [[ "$SOURCE_BRANCH" != "main" ]]; then
              release_tag="${release_tag}-dev.${RUN_NUMBER}"
            fi
          fi
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Build and verify archive
        id: archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          source_dir="SDK/SDK_Python/CoreGeek"
          if [[ ! -d "$source_dir" ]]; then
            echo "::error::Required directory not found: $source_dir"
            exit 1
          fi

          archive="CoreGeek-${RELEASE_TAG}.tar.gz"
          python3 tools/check_log_key_packaging.py "$source_dir"
          tar --create --gzip --file "$archive" \
            --directory "SDK/SDK_Python" \
            "CoreGeek"

          tar --list --gzip --file "$archive" >/dev/null
          printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release and upload archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.archive.outputs.tag }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch --force --tags origin
            tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"

            if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo "::error::Release $RELEASE_TAG already points to $tag_sha, not $SOURCE_SHA"
              exit 1
            fi

            gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            release_flags=()
            if [[ "$SOURCE_BRANCH" != "main" ]]; then
              release_flags+=(--prerelease)
            fi
            # Use GitHub's generated PR/changelog content with Chinese section labels.
            notes_file="$(mktemp)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" -f target_commitish="$SOURCE_SHA" \
              --jq .body > "$notes_file"
            python3 - "$notes_file" <<'PYNOTES'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          for source, target in (("## What's Changed", "## 本次更新"),
                                 ("## New Contributors", "## 新贡献者"),
                                 ("**Full Changelog**", "**完整变更记录**")):
              text = text.replace(source, target)
          path.write_text(text)
          PYNOTES
            gh release create "$RELEASE_TAG" "$ARCHIVE_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" "${release_flags[@]}"
            rm -f "$notes_file"
          fi

